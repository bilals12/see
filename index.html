<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>acmon</title>
    <style>
    body {
        background-color: #000;
        color: #0f0;
        font-family: monospace;
        margin: 20px;
    }

    #stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 30px;
        text-align: center;
    }

    .stat-box {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .stat-label {
        font-size: 1.2em;
        margin-bottom: 0.5em;
    }

    .stat-value {
        font-size: 2em;
    }

    #chart {
        border: 1px dotted #0f0;
        width: 100%;
        height: 400px;
        margin-top: 20px;
    }

    .tooltip {
        background: rgba(0, 255, 0, 0.1);
        border: 1px solid #0f0;
        color: #0f0;
        padding: 8px;
        font-family: monospace;
    }

    .grid line {
        stroke: #0f0;
        stroke-opacity: 0.1;
    }
    </style>
    <!-- include D3.js -->
    <script src="https://d3js.org/d3.v6.min.js"></script>
</head>
<body>
    <div id="stats">
        <div class="stat-box">
            <div class="stat-label">Left Clicks</div>
            <div class="stat-value" id="leftclicks">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Right Clicks</div>
            <div class="stat-value" id="rightclicks">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Keypresses</div>
            <div class="stat-value" id="keypresses">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Mouse Movement</div>
            <div class="stat-value" id="mousemoves">0m</div>
        </div>
    </div>

    <div id="chart"></div>

    <!-- include custom visualization script -->
    <script src="visualization.js"></script>
</body>
</html>
